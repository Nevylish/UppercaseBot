name: CI

on:
    pull_request:
        branches: [master]

jobs:
    build:
        name: Build & typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install
              run: npm ci

            - name: Build
              run: npm run build
